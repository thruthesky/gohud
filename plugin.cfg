[plugin]

name="gohud"
description="Customizable HUD & UI kit for Godot 4.7+: modal surfaces, sheets, dialogs, forms, notices, HUD bars, quick slots and a virtual joystick. Swappable icon sets and themes, safe-area and virtual-keyboard aware, 48dp touch targets, RTL ready. Works without enabling the plugin. Tested on Godot 4.7; officially supports Godot 4.7 and newer."
author="gohud contributors"
version="1.2.0"
script="plugin.gd"
