[plugin]

name="gohud"
description="Customizable HUD & UI kit for Godot 4.6+: modal surfaces, sheets, dialogs, forms, notices, HUD bars, quick slots and a virtual joystick. Swappable icon sets and themes, safe-area and virtual-keyboard aware, 48dp touch targets, RTL ready. Works without enabling the plugin. Requires Godot 4.6 or newer."
author="gohud contributors"
version="1.0.1"
script="plugin.gd"
