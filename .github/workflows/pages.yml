# gohud documentation site deploy — publishes `www/` as the root of https://thruthesky.github.io/gohud/.
#
# 🛑 Settings → Pages → Build and deployment → Source must be **GitHub Actions**.
#    "Deploy from a branch" only offers `/`(root) and `/docs`, so `www/` cannot be the root there.
# 🔑 The assembly rules live in one place, `tools/build_site.sh` — `www/` at the root, plus a copy at
#    the old image paths (`docs/www/img/…`).
#    `python3 tools/check_site.py` assembles with the same script and checks it, so what you saw
#    locally is what goes up.
# 🔑 Only a push that touches the site deploys. To publish again: Actions tab → Pages → Run workflow.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "tools/build_site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# A push arriving mid-deploy does not cancel it; they publish in turn — so no half-published site is left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tools/build_site.sh _site
      # Files starting with a dot (`.gdignore`) are not uploaded.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
