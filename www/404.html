<title>gohud — page not found</title>
<link rel="icon" href="https://thruthesky.github.io/gohud/site/favicon.svg" type="image/svg+xml">
<script>
/* 사이트가 2026-09-15 에 …/gohud/docs/www/ 에서 …/gohud/ 로 옮겨졌다. GitHub Pages 는 없는 주소마다
   이 파일을 내주므로, 옛 주소(docs/www/…, 그 전의 docs/… · docs/ko/…)를 여기서 새 주소로 넘긴다. */
(function () {
  var path = location.pathname;
  var moved = path.replace(/\/docs(?:\/www)?(?=\/|$)\/?/, "/");
  if (moved !== path) location.replace(moved + location.search + location.hash);
})();
</script>

  main { max-width: 32rem; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 28px; }
